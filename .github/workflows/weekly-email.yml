name: Weekly email

# Runs hourly and relies on scripts/send_email.py itself to decide whether
# it's actually Thursday at the scheduled local hour (Australia/Hobart survives
# daylight saving this way; a single fixed UTC cron time would not) and
# whether this week's email has already gone out (data/weekly_state.json).
# This also absorbs GitHub Actions' cron delay, which can be several minutes.
on:
  schedule:
    # Every hour at :05 UTC. Offset from the other two workflows so their
    # commits-back-to-main don't collide (see site-rebuild.yml / deadline-reminder.yml).
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now regardless of day/time (for testing -- still de-duplicated per week)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send weekly email if it's the scheduled time
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python -m scripts.send_email --mode weekly ${{ inputs.force && '--force' || '' }}

      - name: Commit and push weekly_state.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/weekly_state.json ]; then
            git add data/weekly_state.json
          fi
          if git diff --cached --quiet; then
            echo "No state change -- nothing to commit."
            exit 0
          fi
          git commit -m "Record weekly email sent [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (another workflow likely pushed first) -- rebasing and retrying, attempt $attempt"
            git pull --rebase
          done
          git push
